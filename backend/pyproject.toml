[project]
name = "app"
version = "0.1.0"
description = "FastAPI backend with LLM and PyTorch endpoints"
license = "MIT"
authors = [{ name = "Sebastian Messingfeld", email = "sebastian@messeb.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.120",
    "numpy>=2.5.4",
    "openai>=2.0",
    "pydantic-settings>=2.10",
    "torch>=2.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
app = "app.main:run"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- PyTorch: CPU-only wheels on every platform (small image, no CUDA) -------
# Swap the index URL for e.g. https://download.pytorch.org/whl/cu128 for GPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- Ruff --------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC",
    "PT", "RET", "PL", "TID", "FAST",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# --- Mypy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

# --- Pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=app --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]
