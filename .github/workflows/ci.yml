# Quality gate: lint, type-check, test and build every change.
# Runs on every PR, on pushes to long-lived/release branches, and is reused by publish.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**", "hotfix/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.7"
  PNPM_VERSION: "12.3.4"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          # No caches on release builds (tags) to rule out cache poisoning.
          enable-cache: ${{ github.ref_type != 'tag' }}
          cache-dependency-glob: backend/uv.lock
      - name: Install (lockfile must be up to date)
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .
      - name: Format (ruff)
        run: uv run ruff format --check --diff .
      - name: Type-check (mypy --strict)
        run: uv run mypy
      - name: Test (pytest, coverage gate)
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          cache: ${{ github.ref_type != 'tag' && 'pnpm' || '' }}
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Format (prettier)
        run: pnpm format:check
      - name: Lint (oxlint + eslint)
        run: pnpm lint
      - name: Type-check (vue-tsc)
        run: pnpm type-check
      - name: Test (vitest)
        run: pnpm test
      - name: Build
        run: pnpm build-only

  container:
    name: Container build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: ${{ github.ref_type != 'tag' && 'type=gha' || '' }}
          cache-to: ${{ github.ref_type != 'tag' && 'type=gha,mode=max' || '' }}
      - name: Smoke test the image
        run: |
          docker run -d --name app -p 8000:8000 app:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health/ready && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health/ready
          curl -fsS http://localhost:8000/ | grep -q '<div id="app">'
          curl -fsS -X POST http://localhost:8000/api/v1/ml/similarity \
            -H 'Content-Type: application/json' -d '{"vectors":[[1,0],[0,1]]}'
      - name: Container logs
        if: always()
        run: docker logs app || true

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: actionlint (syntax, expressions, shellcheck)
        run: uvx --from actionlint-py==1.7.12.25 actionlint
      - name: zizmor (Actions security audit)
        run: uvx zizmor==1.32.0 --format=github .github/workflows

  # Single, stable status check for branch protection: add "CI passed" as required.
  ci-passed:
    name: CI passed
    if: always()
    needs: [backend, frontend, container, workflows]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs succeeded
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All CI jobs passed."
      - name: Some job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
