# Weekly, grouped dependency updates – all PRs target develop (Git Flow).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node must track the Node runtime (24 LTS in Dockerfile and CI).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: ci, include: scope }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
